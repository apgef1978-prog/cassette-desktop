name: build-windows-exe

# Сборка одного .exe под Windows (PyInstaller не кросс-компилит — нужен windows-runner).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:        # ручной запуск из вкладки Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .exe
        run: pyinstaller --noconfirm build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cassette-insert-windows
          path: dist/*.exe
          if-no-files-found: error

  # На тег vX.Y.Z — заодно публикуем .exe в GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cassette-insert-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
