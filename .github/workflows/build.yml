name: build-windows-exe

# Пуш в master -> только самопроверки (быстро).
# Pull request -> только самопроверки (сборка .exe не нужна).
# Тег vX.Y.Z   -> проверки + сборка .exe + GitHub Release.
# Ручной запуск -> проверки + сборка (артефакт без релиза).
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Сборка .docx не требует GUI, поэтому ядро проверяется на ubuntu — дешевле.
      - name: Self-tests
        run: python test_core.py

  build:
    needs: test
    # На коммит в master .exe не собираем: при пуше коммита вместе с тегом
    # получилось бы две сборки на один SHA (так и было до правки).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # нужны теги: из аннотации собираем описание релиза

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .exe
        run: pyinstaller --noconfirm build.spec

      # generate_release_notes без PR даёт пустое описание (только ссылка), поэтому
      # берём текст аннотации тега: git tag -a v1.7.4 -m "..." и он попадёт в релиз.
      - name: Release notes from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${GITHUB_REPOSITORY}" "$prev" "${GITHUB_REF_NAME}" >> release-notes.md
          fi
          cat release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cassette-insert-windows
          path: |
            dist/*.exe
            release-notes.md
          if-no-files-found: error

  # На тег vX.Y.Z — публикуем .exe в GitHub Release с описанием из аннотации тега
  # (раньше 13 релизов подряд ушли с пустым описанием).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cassette-insert-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: release-notes.md
